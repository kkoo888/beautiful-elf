<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gInput" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gIntent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gAgent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gRAG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gTool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="gMemory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="gStore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="1500" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="550" y="45" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="700">Beautiful-Elf Agent 架构流程图</text>
  <text x="550" y="70" text-anchor="middle" fill="#64748b" font-size="13">LlamaIndex + LangChain + LangGraph · 多供应商 · 意图路由</text>

  <!-- ═══════ 1. 用户输入 ═══════ -->
  <rect x="380" y="95" width="340" height="50" rx="25" fill="url(#gInput)" filter="url(#shadow)"/>
  <text x="550" y="126" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">👤 用户输入</text>

  <!-- Arrow down -->
  <line x1="550" y1="145" x2="550" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ═══════ 2. 意图路由层 ═══════ -->
  <rect x="300" y="180" width="500" height="110" rx="12" fill="url(#gIntent)" filter="url(#shadow)" opacity="0.95"/>
  <text x="550" y="208" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">⚡ 意图路由层</text>
  <text x="550" y="230" text-anchor="middle" fill="#fef3c7" font-size="12">用户消息 Embedding → Qdrant intent_vectors 相似度检索</text>
  <text x="550" y="250" text-anchor="middle" fill="#fef3c7" font-size="12">语义缓存检查 → 意图命中 → 路由 / 未命中 → Agent</text>
  <text x="550" y="275" text-anchor="middle" fill="#fde68a" font-size="11">Embedding: dengcao/Qwen3-Embedding-0.6B:Q8_0</text>

  <!-- Branch arrows from intent -->
  <line x1="420" y1="290" x2="280" y2="340" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="550" y1="290" x2="550" y2="340" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="290" x2="820" y2="340" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Cache hit -->
  <rect x="140" y="345" width="200" height="40" rx="8" fill="#92400e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="240" y="370" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">💾 语义缓存命中 → 直接返回</text>

  <!-- Skill hit -->
  <rect x="720" y="345" width="200" height="40" rx="8" fill="#92400e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="820" y="370" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">🎯 技能命中 → 路由执行</text>

  <!-- Arrow down to Agent -->
  <line x1="550" y1="340" x2="550" y2="395" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="378" fill="#64748b" font-size="11">未命中</text>

  <!-- ═══════ 3. Agent 引擎 ═══════ -->
  <rect x="200" y="400" width="700" height="280" rx="12" fill="url(#gAgent)" filter="url(#shadow)" opacity="0.95"/>
  <text x="550" y="430" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">🤖 Agent 引擎 (LangGraph StateGraph)</text>

  <!-- Inner nodes -->
  <!-- Context Builder -->
  <rect x="230" y="450" width="180" height="70" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="320" y="478" text-anchor="middle" fill="#a7f3d0" font-size="13" font-weight="600">📦 上下文构建</text>
  <text x="320" y="498" text-anchor="middle" fill="#6ee7b7" font-size="11">RAG 检索 + 记忆检索</text>
  <text x="320" y="513" text-anchor="middle" fill="#6ee7b7" font-size="10">并行 · 含降级</text>

  <!-- LLM Call -->
  <rect x="460" y="450" width="180" height="70" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="550" y="478" text-anchor="middle" fill="#a7f3d0" font-size="13" font-weight="600">🧠 LLM 调用</text>
  <text x="550" y="498" text-anchor="middle" fill="#6ee7b7" font-size="11">上下文裁剪 + Tool Calling</text>
  <text x="550" y="513" text-anchor="middle" fill="#6ee7b7" font-size="10">多供应商: Ollama / OpenAI</text>

  <!-- Tool Executor -->
  <rect x="230" y="545" width="180" height="70" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="320" y="573" text-anchor="middle" fill="#a7f3d0" font-size="13" font-weight="600">🔧 工具执行</text>
  <text x="320" y="593" text-anchor="middle" fill="#6ee7b7" font-size="11">风险分级 + 审批 + 重试</text>
  <text x="320" y="608" text-anchor="middle" fill="#6ee7b7" font-size="10">LOW / MED / HIGH</text>

  <!-- Memory Saver -->
  <rect x="460" y="545" width="180" height="70" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="550" y="573" text-anchor="middle" fill="#a7f3d0" font-size="13" font-weight="600">💾 记忆保存</text>
  <text x="550" y="593" text-anchor="middle" fill="#6ee7b7" font-size="11">Redis 会话缓存</text>
  <text x="550" y="608" text-anchor="middle" fill="#6ee7b7" font-size="10">Token 预算控制</text>

  <!-- Decision -->
  <rect x="690" y="490" width="180" height="50" rx="8" fill="#065f46" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="780" y="512" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">🔀 需要工具？</text>
  <text x="780" y="530" text-anchor="middle" fill="#fde68a" font-size="10">≤5轮 · Token预算</text>

  <!-- Agent internal arrows -->
  <line x1="410" y1="485" x2="455" y2="485" stroke="#6ee7b7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="640" y1="485" x2="685" y2="510" stroke="#6ee7b7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="780" y1="540" x2="320" y2="548" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowAmber)"/>
  <text x="550" y="548" text-anchor="middle" fill="#fde68a" font-size="10">工具结果回传</text>
  <line x1="640" y1="570" x2="550" y2="570" stroke="#6ee7b7" stroke-width="1.5"/>
  <line x1="780" y1="540" x2="550" y2="548" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Agent → Output -->
  <line x1="550" y1="615" x2="550" y2="620" stroke="#94a3b8" stroke-width="2"/>

  <!-- Loop arrow back -->
  <path d="M 780 540 Q 850 480 640 485" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowAmber)"/>

  <!-- ═══════ 4. 输出 + 持久化 ═══════ -->
  <line x1="550" y1="680" x2="550" y2="720" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="350" y="725" width="400" height="55" rx="10" fill="url(#gInput)" filter="url(#shadow)"/>
  <text x="550" y="750" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">📤 输出 + 持久化</text>
  <text x="550" y="770" text-anchor="middle" fill="#bfdbfe" font-size="11">MySQL: 用户消息 + 助手回复 + 工具调用记录</text>

  <!-- Output branches -->
  <line x1="420" y1="780" x2="250" y2="830" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="780" x2="550" y2="830" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="780" x2="850" y2="830" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="835" width="180" height="35" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="230" y="857" text-anchor="middle" fill="#93c5fd" font-size="12">REST API 响应</text>

  <rect x="460" y="835" width="180" height="35" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="550" y="857" text-anchor="middle" fill="#93c5fd" font-size="12">SSE 流式输出</text>

  <rect x="760" y="835" width="180" height="35" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="850" y="857" text-anchor="middle" fill="#93c5fd" font-size="12">WebSocket 推送</text>

  <!-- ═══════ 5. RAG 管道详情 ═══════ -->
  <line x1="230" y1="450" x2="120" y2="450" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="900" width="340" height="180" rx="12" fill="url(#gRAG)" filter="url(#shadow)" opacity="0.95"/>
  <text x="190" y="930" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">📚 RAG 管道 (LlamaIndex)</text>

  <text x="190" y="958" text-anchor="middle" fill="#ddd6fe" font-size="12">SimpleDirectoryReader → 文档解析</text>
  <text x="190" y="978" text-anchor="middle" fill="#ddd6fe" font-size="12">SentenceSplitter → 分块 (512字符)</text>
  <text x="190" y="998" text-anchor="middle" fill="#ddd6fe" font-size="12">Ollama Embedding → 向量化</text>
  <text x="190" y="1018" text-anchor="middle" fill="#ddd6fe" font-size="12">QdrantVectorStore → 存储检索</text>
  <text x="190" y="1038" text-anchor="middle" fill="#ddd6fe" font-size="12">SentenceTransformerRerank → 重排序</text>
  <text x="190" y="1065" text-anchor="middle" fill="#c4b5fd" font-size="11">Collection: knowledge_chunks</text>

  <!-- ═══════ 6. 工具详情 ═══════ -->
  <rect x="380" y="900" width="340" height="180" rx="12" fill="url(#gTool)" filter="url(#shadow)" opacity="0.95"/>
  <text x="550" y="930" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">🔧 工具注册表</text>

  <text x="550" y="958" text-anchor="middle" fill="#fecaca" font-size="12">🌐 web_search — DuckDuckGo 搜索 [LOW]</text>
  <text x="550" y="978" text-anchor="middle" fill="#fecaca" font-size="12">💻 execute_code — Docker 沙箱 [HIGH]</text>
  <text x="550" y="998" text-anchor="middle" fill="#fecaca" font-size="12">📄 read_file — 工作空间文件 [LOW]</text>
  <text x="550" y="1018" text-anchor="middle" fill="#fecaca" font-size="12">🗃️ query_database — SQL 只读 [MED]</text>
  <text x="550" y="1048" text-anchor="middle" fill="#fca5a5" font-size="11">LangChain Tool 兼容 · 风险审批 · 自动重试</text>
  <text x="550" y="1068" text-anchor="middle" fill="#fca5a5" font-size="11">HIGH 级工具需用户确认才执行</text>

  <!-- ═══════ 7. 记忆系统详情 ═══════ -->
  <rect x="740" y="900" width="340" height="180" rx="12" fill="url(#gMemory)" filter="url(#shadow)" opacity="0.95"/>
  <text x="910" y="930" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">🧠 两层记忆系统</text>

  <text x="910" y="958" text-anchor="middle" fill="#cffafe" font-size="12">Redis — 会话缓存 (TTL 1h)</text>
  <text x="910" y="978" text-anchor="middle" fill="#cffafe" font-size="12">Qdrant memory_vectors — 长期记忆</text>
  <text x="910" y="998" text-anchor="middle" fill="#cffafe" font-size="12">  ├ type=detail — 每小时完整日志</text>
  <text x="910" y="1018" text-anchor="middle" fill="#cffafe" font-size="12">  └ type=summary — 30min空 LLM摘要</text>
  <text x="910" y="1048" text-anchor="middle" fill="#a5f3fc" font-size="11">Celery 定时任务自动归档</text>
  <text x="910" y="1068" text-anchor="middle" fill="#a5f3fc" font-size="11">检索: 摘要优先 → 详细日志补充</text>

  <!-- ═══════ 8. 存储层 ═══════ -->
  <rect x="120" y="1120" width="860" height="100" rx="12" fill="url(#gStore)" filter="url(#shadow)" opacity="0.95"/>
  <text x="550" y="1150" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">💾 存储层</text>

  <!-- MySQL -->
  <rect x="150" y="1165" width="220" height="40" rx="6" fill="#334155" stroke="#64748b" stroke-width="1"/>
  <text x="260" y="1190" text-anchor="middle" fill="#cbd5e1" font-size="13">🐬 MySQL — 关系业务数据</text>

  <!-- Qdrant -->
  <rect x="400" y="1165" width="220" height="40" rx="6" fill="#334155" stroke="#64748b" stroke-width="1"/>
  <text x="510" y="1190" text-anchor="middle" fill="#cbd5e1" font-size="13">🔷 Qdrant — 所有向量数据</text>

  <!-- Redis -->
  <rect x="650" y="1165" width="150" height="40" rx="6" fill="#334155" stroke="#64748b" stroke-width="1"/>
  <text x="725" y="1190" text-anchor="middle" fill="#cbd5e1" font-size="13">🔴 Redis — 缓存</text>

  <!-- Ollama -->
  <rect x="830" y="1165" width="130" height="40" rx="6" fill="#334155" stroke="#64748b" stroke-width="1"/>
  <text x="895" y="1190" text-anchor="middle" fill="#cbd5e1" font-size="13">🦙 Ollama 本地</text>

  <!-- ═══════ 9. 降级策略 ═══════ -->
  <rect x="120" y="1250" width="860" height="90" rx="10" fill="#1c1917" stroke="#78716c" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="550" y="1275" text-anchor="middle" fill="#a8a29e" font-size="14" font-weight="600">🛡️ 降级策略链</text>
  <text x="550" y="1298" text-anchor="middle" fill="#78716c" font-size="12">完整模式 → 意图不可用(跳过) → RAG不可用(纯Agent) → 工具不可用(纯对话) → LLM不可用(缓存回答)</text>
  <text x="550" y="1318" text-anchor="middle" fill="#78716c" font-size="11">每个组件独立 try-catch · 任一失败不影响其他 · 降级日志写 LangFuse</text>

  <!-- ═══════ 10. 可观测 ═══════ -->
  <rect x="120" y="1365" width="400" height="50" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="320" y="1390" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="600">📊 LangFuse Tracing — 全链路追踪</text>
  <text x="320" y="1408" text-anchor="middle" fill="#818cf8" font-size="11">每步节点耗时 · Token 消耗 · 工具调用记录</text>

  <!-- Eval -->
  <rect x="560" y="1365" width="420" height="50" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="770" y="1390" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="600">🧪 评估流水线 — 规则初筛 + LLM 复核</text>
  <text x="770" y="1408" text-anchor="middle" fill="#818cf8" font-size="11">关键词命中 + 禁止词检查 + 边界case LLM-as-judge</text>

  <!-- Footer -->
  <text x="550" y="1465" text-anchor="middle" fill="#475569" font-size="12">Beautiful-Elf · architecture-upgrade.md · 2026-06-05</text>
</svg>
